<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b52"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>DokoHilf</title><style>body{margin:0;background:#f3f7f5;color:#15221f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}.load{text-align:center}.mark{width:58px;height:58px;margin:auto;border-radius:18px;background:#0b6b52;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:0 18px 50px rgba(11,107,82,.25)}p{color:#66736f}</style></head><body><div class="load"><div class="mark">D</div><h1>DokoHilf</h1><p>Arbeitswege werden geladen …</p></div><script>(async()=>{let s="";for(const n of ["dh1","dh2","dh3","dh4a","dh4b"]){const r=await fetch(`/DokoHilf/assets/${n}.txt?v=7`,{cache:"no-store"});if(!r.ok)throw new Error("payload");s+=(await r.text()).trim()}const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const h=new TextDecoder().decode(b);document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<main style="padding:32px;font-family:sans-serif"><h1>DokoHilf konnte nicht geladen werden</h1><p>Bitte die Seite neu laden.</p><pre>'+String(e)+'</pre></main>'})</script></body></html>

name: Direct final guide audio v27

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-direct-final-audio-v27
  cancel-in-progress: true

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest branch without marketplace actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin feat/dark-premium-static-guide-audio-v27
          git checkout -B feat/dark-premium-static-guide-audio-v27 FETCH_HEAD

      - name: Generate the next approved Gacrux audio batch
        id: generate
        run: |
          set +e
          node scripts/generate-guide-audio.mjs
          generation_status=$?
          set -e
          echo "status=${generation_status}" >> "$GITHUB_OUTPUT"
          echo "Generator exit status: ${generation_status}"

      - name: Persist every successful audio and checkpoint
        run: |
          set -euo pipefail
          git add -A assets
          if git diff --cached --quiet; then
            echo "No new guide audio progress in this round."
            exit 0
          fi
          completed="$(node -e "const s=require('./assets/guide-audio-generation-status.json');process.stdout.write(String(s.completed))")"
          total="$(node -e "const s=require('./assets/guide-audio-generation-status.json');process.stdout.write(String(s.total))")"
          git commit -m "Checkpoint prebuilt Gacrux audio ${completed} of ${total}"
          git pull --rebase origin feat/dark-premium-static-guide-audio-v27
          git push origin HEAD:feat/dark-premium-static-guide-audio-v27

      - name: Verify complete manifest, hashes and WAV headers
        if: steps.generate.outputs.status == '0'
        run: node --test tests/prebuilt-guide-audio.test.mjs

      - name: Keep incomplete generation visibly blocked
        if: steps.generate.outputs.status != '0'
        run: |
          status='${{ steps.generate.outputs.status }}'
          if [ -s assets/guide-audio-generation-status.json ]; then
            cat assets/guide-audio-generation-status.json
          fi
          echo "Static guide audio remains incomplete. Restart manually only after the external provider quota has recovered."
          exit "${status}"

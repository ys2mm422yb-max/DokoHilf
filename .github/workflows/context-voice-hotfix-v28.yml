name: Context and Voice Hotfix v28

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@v4

      - name: Validate hotfix syntax and contracts
        run: |
          set -euo pipefail
          node --check assets/context-voice-hotfix-v28.js
          node --check assets/detail-help-render-sync-v27.js
          node --check scripts/apply-detail-help-v27.mjs
          node --test tests/local-voice-v28.test.mjs tests/detail-help-v27.test.mjs tests/voice-clarification-static-v45.test.mjs
          python3 scripts/build-supertonic-guide-audio-v28.py --validate-only
          grep -q 'Hier werden fachliche Beobachtungen und Ereignisse als Berichtseinträge dokumentiert' assets/voice-extra-catalog-v28.json
          if grep -q "'target-missing': 'Vitalwerte fehlt'" assets/detail-help-render-sync-v27.js; then
            echo 'Bericht-Hilfe darf keinen globalen Vitalwerte-Label-Override mehr enthalten.' >&2
            exit 1
          fi

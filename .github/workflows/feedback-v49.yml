name: Validate private feedback v49

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dokohilf-feedback-v49-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@v4

      - name: Validate feedback privacy and release contracts
        run: |
          set -euo pipefail
          test -s assets/feedback-report-v49.js
          test -s supabase/functions/dokohilf-feedback/index.ts
          test -s supabase/migrations/20260813083000_private_feedback_v49.sql
          test -s tests/feedback-report-v49.test.mjs
          test -s scripts/feedback-render-v49.mjs
          node --check assets/feedback-report-v49.js
          node --check assets/ui-polish-v35.js
          node --check scripts/feedback-render-v49.mjs
          node --test tests/feedback-report-v49.test.mjs
          grep -q '\[functions.dokohilf-feedback\]' supabase/config.toml
          grep -q 'verify_jwt = false' supabase/config.toml
          grep -q 'private.dokohilf_feedback_reports' supabase/migrations/20260813083000_private_feedback_v49.sql
          grep -q 'to service_role' supabase/migrations/20260813083000_private_feedback_v49.sql
          ! grep -Eqi '^\s*(ip_address|user_agent|session_id|user_id|device_id|chat_transcript|messages?|audio|screenshot)\s+' supabase/migrations/20260813083000_private_feedback_v49.sql

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck public feedback endpoint
        run: deno check supabase/functions/dokohilf-feedback/index.ts

      - name: Build feedback UI test site
        run: |
          set -euo pipefail
          bash scripts/build-static-site-v27.sh _feedback_site
          test -s _feedback_site/assets/feedback-report-v49.js
          grep -q 'feedback-report-v49.js' _feedback_site/assets/ui-polish-v35.js
          grep -q "const VERSION_LABEL = 'v31'" _feedback_site/assets/release-polish-v29.js
          node -e "const v=require('./_feedback_site/version.json'); if(v.appVersion!=='v31') process.exit(1)"

      - name: Render feedback modal on iOS and Android
        run: |
          set -euo pipefail
          mkdir -p artifacts/feedback-v49/ios artifacts/feedback-v49/android
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _feedback_site >artifacts/feedback-v49-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          DOKOHILF_VIEWPORT_WIDTH=393 DOKOHILF_VIEWPORT_HEIGHT=852 DOKOHILF_RENDER_URL=http://127.0.0.1:4173/ DOKOHILF_RENDER_OUTPUT=artifacts/feedback-v49/ios node scripts/feedback-render-v49.mjs
          DOKOHILF_VIEWPORT_WIDTH=412 DOKOHILF_VIEWPORT_HEIGHT=915 DOKOHILF_RENDER_URL=http://127.0.0.1:4173/ DOKOHILF_RENDER_OUTPUT=artifacts/feedback-v49/android node scripts/feedback-render-v49.mjs

      - name: Upload feedback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-feedback-v49-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

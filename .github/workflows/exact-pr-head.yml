name: Validate exact PR head

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dokohilf-exact-head-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prove exact head and syntax
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --check assets/app.js
          node --check assets/smart-help-v29.js
          node --check assets/local-voice-v28.js
          node --check assets/local-voice-gate-v28.js
          node --check scripts/mobile-render-v27.mjs

      - name: Run behavior regressions
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs

      - name: Run v66 regressions
        run: |
          set -euo pipefail
          mapfile -d '' V66_TESTS < <(find tests -maxdepth 1 -type f -name '*v66*.test.mjs' -print0 | sort -z)
          test "${#V66_TESTS[@]}" -gt 0
          node --test "${V66_TESTS[@]}"

      - name: Run legacy Dateiablage regression
        run: node --test tests/dateiablage-v46.test.mjs

      - name: Run legacy completion regression
        run: node --test tests/guide-completion-v40.test.mjs

      - name: Run legacy handover regression
        run: node --test tests/handover-detail-v51.test.mjs

      - name: Run legacy user-facing regression
        run: node --test tests/user-facing-hotfix-v48.test.mjs

      - name: Run remaining existing regression suite
        run: |
          set -euo pipefail
          mapfile -d '' EXISTING_TESTS < <(find tests -maxdepth 1 -type f -name '*.test.mjs' \
            ! -name '*v66*.test.mjs' \
            ! -name 'dateiablage-v46.test.mjs' \
            ! -name 'guide-completion-v40.test.mjs' \
            ! -name 'handover-detail-v51.test.mjs' \
            ! -name 'user-facing-hotfix-v48.test.mjs' \
            -print0 | sort -z)
          test "${#EXISTING_TESTS[@]}" -gt 0
          node --test "${EXISTING_TESTS[@]}"

      - name: Validate static Supertonic catalog
        run: |
          set -euo pipefail
          python3 scripts/build-supertonic-guide-audio-v28.py --validate-only

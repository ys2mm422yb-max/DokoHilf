name: Final approved guide audio v27

on:
  push:
    branches: [feat/dark-premium-static-guide-audio-v27]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-final-audio-v27-${{ github.sha }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/dark-premium-static-guide-audio-v27

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate all approved Gacrux WAV files
        run: node scripts/generate-guide-audio.mjs

      - name: Verify generated manifest and audio
        run: node --test tests/prebuilt-guide-audio.test.mjs

      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/guide-audio-manifest.json assets/audio/guides
          if git diff --cached --quiet; then
            echo "All approved audio files are already committed."
            exit 0
          fi
          git commit -m "Add prebuilt Gacrux audio for approved guides"
          git pull --rebase origin feat/dark-premium-static-guide-audio-v27
          git push origin HEAD:feat/dark-premium-static-guide-audio-v27

name: Generate approved guide audio

on:
  push:
    branches: [feat/dark-premium-fast-voice-v27]
    paths:
      - assets/guide-audio-catalog.json
      - scripts/generate-guide-audio.mjs
      - .github/workflows/generate-guide-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-approved-guide-audio-v27
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'ys2mm422yb-max/DokoHilf'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/dark-premium-fast-voice-v27

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate all approved Gacrux guide audios
        run: node scripts/generate-guide-audio.mjs

      - name: Validate manifest, hashes and WAV files
        run: node --test tests/prebuilt-guide-audio.test.mjs

      - name: Commit generated static audio to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/guide-audio-manifest.json assets/audio/guides
          if git diff --cached --quiet; then
            echo "Approved guide audio is already current."
            exit 0
          fi
          git commit -m "Add prebuilt Gacrux audio for approved guides"
          git push origin HEAD:feat/dark-premium-fast-voice-v27

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-guide-audio-v27-${{ github.run_number }}
          path: |
            assets/guide-audio-catalog.json
            assets/guide-audio-manifest.json
            assets/audio/guides/*.wav
          if-no-files-found: warn
          retention-days: 30

name: DokoHilf Release Validation Bridge

on:
  workflow_run:
    workflows: ["Publish DokoHilf to gh-pages"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  start-current-release-validation:
    if: github.event.workflow_run.run_number == 9
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact current PR 53 validation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-dispatcher.yml',
              ref: 'main',
            });
            core.notice('gh-pages helper run #9 completed; started current exact-head Build 27 validation.');

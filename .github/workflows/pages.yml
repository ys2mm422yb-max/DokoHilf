name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dokohilf-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and build static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets artifacts
          cp index.html editor.html manifest.webmanifest icon.svg service-worker.js version.json _site/
          cp \
            assets/styles.css \
            assets/premium-ui-v25.css \
            assets/premium-ui-v26.css \
            assets/premium-ui-v27.css \
            assets/ux-v27.css \
            assets/experience-v27.js \
            assets/ux-v27.js \
            assets/update-manager.js \
            assets/mobile-audio-fix.js \
            assets/voice-diagnostics.js \
            assets/routing-fix.js \
            assets/conversation-intelligence.js \
            assets/clarification-ui.js \
            assets/guide-progress.js \
            assets/voice-focus-mode.js \
            assets/app.js \
            assets/editor.css \
            assets/editor.js \
            _site/assets/
          touch _site/.nojekyll

          for file in \
            README.md PROJECT_RULES.md PROJECT_HANDOFF.md CONFIRMED_WORKFLOWS.md \
            _site/index.html _site/editor.html _site/version.json _site/service-worker.js \
            _site/assets/styles.css _site/assets/premium-ui-v25.css _site/assets/premium-ui-v26.css _site/assets/premium-ui-v27.css _site/assets/ux-v27.css \
            _site/assets/experience-v27.js _site/assets/ux-v27.js _site/assets/update-manager.js _site/assets/mobile-audio-fix.js \
            _site/assets/voice-diagnostics.js _site/assets/routing-fix.js \
            _site/assets/conversation-intelligence.js _site/assets/clarification-ui.js \
            _site/assets/guide-progress.js _site/assets/voice-focus-mode.js _site/assets/app.js \
            supabase/functions/dokohilf-ai-router/index.ts supabase/functions/dokohilf-tts/index.ts \
            supabase/functions/dokohilf-editor/index.ts \
            supabase/migrations/20260805224500_dokohilf_editor_rbac.sql \
            supabase/migrations/20260806112000_vitalwerte_intent_guides.sql \
            supabase/migrations/20260806112100_vitalwerte_intent_alias_alignment.sql \
            supabase/migrations/20260806112200_noop_verify_vitalwerte_guides.sql \
            supabase/migrations/20260806153000_confirmed_workflows_blocks_1_4.sql \
            supabase/migrations/20260806173000_remove_repeated_exercise_notices.sql \
            scripts/run-behavior-regressions.mjs scripts/live-routing-smoke.mjs scripts/live-routing-stable.mjs \
            scripts/live-tts-smoke.mjs scripts/live-screenshot-smoke.mjs \
            tests/vitalwerte-intent.test.mjs tests/live-build-recovery.test.mjs \
            tests/confirmed-workflows.test.mjs tests/intelligent-router-v26.test.mjs tests/voice-layout-v26.test.mjs \
            tests/dark-premium-v27.test.mjs tests/fast-voice-v27.test.mjs; do
            test -s "$file"
          done

          grep -q 'dokohilf-build" content="20260806-27' _site/index.html
          grep -q 'premium-ui-v27.css?v=20260806-27' _site/index.html
          grep -q 'experience-v27.js?v=20260806-27' _site/index.html
          grep -q 'ux-v27.js?v=20260806-27' _site/index.html
          grep -q 'ux-v27.css?v=20260806-27' _site/index.html
          grep -q 'app.js?v=20260806-27' _site/index.html
          grep -q '"buildId": "20260806-27"' _site/version.json
          grep -q "BUILD_ID = '20260806-27'" _site/service-worker.js
          grep -q '__DOKOHILF_DIRECT_ROUTER_V27__' _site/index.html
          grep -q 'KI · v27' _site/index.html
          grep -q 'Bericht anlegen' _site/index.html
          grep -q 'Medikation ansehen' _site/index.html
          grep -q 'Datenschutz aktiv' _site/index.html
          grep -q 'DokoHilfHardRefresh' _site/index.html
          grep -q 'CLEAR_DOKOHILF_CACHES' _site/service-worker.js

          grep -q '__DOKOHILF_DARK_PREMIUM_V27__' _site/assets/experience-v27.js
          grep -q 'FAST_FALLBACK_MS = 2400' _site/assets/experience-v27.js
          grep -q 'nextSpokenText' _site/assets/experience-v27.js
          grep -q 'prefetchText' _site/assets/experience-v27.js
          grep -q 'removeRepeatedExerciseNotice' _site/assets/experience-v27.js
          grep -q 'guide-progress-menu' _site/assets/ux-v27.js
          grep -q 'HARD_FALLBACK_MS = 1900' _site/assets/ux-v27.js
          grep -q '__DOKOHILF_UX_CLEANUP_V27__' _site/assets/ux-v27.js
          grep -q -- '--v27-bg:#020c12' _site/assets/premium-ui-v27.css
          grep -q 'color-scheme:dark' _site/assets/premium-ui-v27.css
          grep -q 'command-message-hidden' _site/assets/ux-v27.css

          grep -q '__DOKOHILF_GUIDE_PROGRESS_PATCH_V2__' _site/assets/guide-progress.js
          grep -q '__DOKOHILF_VOICE_FOCUS_V2__' _site/assets/voice-focus-mode.js
          grep -q '__DOKOHILF_STRUCTURED_CLARIFICATION__' _site/assets/clarification-ui.js

          grep -q 'conversational-guide-router-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'medication-view-only-safety-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'nextSpokenText' supabase/functions/dokohilf-ai-router/index.ts

          grep -q "VOICE_NAME = 'Gacrux'" supabase/functions/dokohilf-tts/index.ts
          grep -q "VOICE_STYLE = 'natural-spoken-german-colleague-v8-low-latency'" supabase/functions/dokohilf-tts/index.ts
          grep -q "PRIMARY_MODEL = 'gemini-3.1-flash-tts-preview'" supabase/functions/dokohilf-tts/index.ts
          grep -q "FALLBACK_MODEL = 'gemini-2.5-flash-preview-tts'" supabase/functions/dokohilf-tts/index.ts
          grep -q 'pendingAudio' supabase/functions/dokohilf-tts/index.ts
          grep -q 'CACHE_TTL_MS = 2 \* 60 \* 60_000' supabase/functions/dokohilf-tts/index.ts
          grep -q 'TRANSKRIPT:' supabase/functions/dokohilf-tts/index.ts

          grep -q 'Wiederholte Fantasiedaten-Hinweise' supabase/migrations/20260806173000_remove_repeated_exercise_notices.sql
          grep -q 'Jeder neue Chat liest zuerst vollständig' PROJECT_HANDOFF.md
          grep -q 'CONFIRMED_WORKFLOWS.md' PROJECT_HANDOFF.md
          grep -q 'Bilder bleiben ausschließlich im Chat' CONFIRMED_WORKFLOWS.md

          grep -q 'Redaktion anmelden' _site/editor.html
          grep -q 'grant_type=password' _site/assets/editor.js
          grep -q 'auth/v1/signup\|signUp(' _site/assets/editor.js && exit 1 || true
          grep -q 'SUPABASE_SERVICE_ROLE_KEY\|service_role' _site/assets/editor.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|dokohilf-ai-history' _site/assets/app.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' _site/assets/voice-focus-mode.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|caches.open' _site/assets/experience-v27.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|caches.open' _site/assets/ux-v27.js && exit 1 || true
          grep -q '\.jpe\?g\|\.png\|IMG_' CONFIRMED_WORKFLOWS.md && exit 1 || true

          node --check _site/assets/update-manager.js
          node --check _site/assets/mobile-audio-fix.js
          node --check _site/assets/voice-diagnostics.js
          node --check _site/assets/routing-fix.js
          node --check _site/assets/conversation-intelligence.js
          node --check _site/assets/clarification-ui.js
          node --check _site/assets/guide-progress.js
          node --check _site/assets/voice-focus-mode.js
          node --check _site/assets/experience-v27.js
          node --check _site/assets/ux-v27.js
          node --check _site/assets/app.js
          node --check _site/assets/editor.js
          node --check _site/service-worker.js
          node --check scripts/live-routing-smoke.mjs
          node --check scripts/live-routing-stable.mjs
          node --check scripts/live-tts-smoke.mjs
          node --check scripts/live-screenshot-smoke.mjs

      - name: Run deterministic behavior regressions
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs
          node --test \
            tests/greeting-routing.test.mjs \
            tests/pwa-update.test.mjs \
            tests/pwa-transition.test.mjs \
            tests/guide-progress.test.mjs \
            tests/clarification.test.mjs \
            tests/voice-diagnostics.test.mjs \
            tests/audio-playback-unlock.test.mjs \
            tests/voice-focus-mode.test.mjs \
            tests/behavior-regression.test.mjs \
            tests/mobile-layout-contract.test.mjs \
            tests/privacy-contract.test.mjs \
            tests/editor-security.test.mjs \
            tests/vitalwerte-intent.test.mjs \
            tests/live-build-recovery.test.mjs \
            tests/confirmed-workflows.test.mjs \
            tests/intelligent-router-v26.test.mjs \
            tests/voice-layout-v26.test.mjs \
            tests/dark-premium-v27.test.mjs \
            tests/fast-voice-v27.test.mjs

      - name: Check active DokoHilf router
        run: |
          node scripts/live-routing-stable.mjs
          node scripts/live-screenshot-smoke.mjs

      - name: Check active DokoHilf voice service
        run: node scripts/live-tts-smoke.mjs

      - name: Upload behavior report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-behavior-report-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

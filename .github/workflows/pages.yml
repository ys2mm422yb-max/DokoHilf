name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dokohilf-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@v4

      - name: Require completed committed guide audio
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -s assets/guide-audio-manifest.json
          test -s assets/guide-audio-generation-status.json
          test "$(node -e "const s=require('./assets/guide-audio-generation-status.json');process.stdout.write(String(s.complete))")" = "true"
          test "$(find assets/audio/guides -maxdepth 1 -type f -name '*.wav' | wc -l | tr -d ' ')" = "93"
          grep -q '"entryCount": 93' assets/guide-audio-manifest.json

      - name: Build exact static site
        run: |
          set -euo pipefail
          bash -n scripts/build-static-site-v27.sh
          bash scripts/build-static-site-v27.sh _site

      - name: Validate source contracts and syntax
        run: |
          set -euo pipefail

          for file in \
            README.md PROJECT_RULES.md PROJECT_HANDOFF.md CONFIRMED_WORKFLOWS.md PREBUILT_AUDIO.md \
            FINAL_SCOPE_V27.md ACTIVE_WORK_STATIC_AUDIO.md \
            assets/guide-audio-catalog.json assets/guide-audio-manifest.json assets/guide-audio-generation-status.json \
            scripts/generate-guide-audio.mjs scripts/mobile-render-v27.mjs scripts/build-static-site-v27.sh \
            scripts/run-behavior-regressions.mjs scripts/live-routing-smoke.mjs \
            scripts/live-routing-stable.mjs scripts/live-tts-smoke.mjs scripts/live-screenshot-smoke.mjs \
            tests/prebuilt-guide-audio.test.mjs tests/dark-premium-v27.test.mjs tests/fast-voice-v27.test.mjs \
            supabase/functions/dokohilf-ai-router/index.ts supabase/functions/dokohilf-tts/index.ts; do
            test -s "$file"
          done

          grep -q '__DOKOHILF_DARK_PREMIUM_V27__' assets/experience-v27.js
          grep -q '__DOKOHILF_PREBUILT_GUIDE_AUDIO_V1__' assets/experience-v27.js
          grep -q 'loadPrebuiltVoice' assets/experience-v27.js
          grep -q 'prebuilt-approved-guide' assets/experience-v27.js
          grep -q 'guide-progress-menu' assets/ux-v27.js
          grep -q '__DOKOHILF_PRIVACY_ACK_V27__' assets/ux-v27.js
          grep -q "PRIVACY_ACK_KEY = 'dokohilf-privacy-ack-v1'" assets/ux-v27.js
          test "$(grep -o 'localStorage\.[a-zA-Z]*' assets/ux-v27.js | sort -u | tr '\n' ' ')" = "localStorage.getItem localStorage.setItem "
          grep -q 'command-message-hidden' assets/ux-v27.css
          grep -q 'data-voice-state="listening"' assets/ux-v27.css
          grep -q -- '--v27-bg:#020c12' assets/premium-ui-v27.css
          grep -q 'color-scheme:dark' assets/premium-ui-v27.css
          grep -q 'conversational-guide-router-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'medication-view-only-safety-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q "VOICE_NAME = 'Gacrux'" supabase/functions/dokohilf-tts/index.ts
          grep -q "PRIMARY_MODEL = 'gemini-3.1-flash-tts-preview'" supabase/functions/dokohilf-tts/index.ts
          grep -q "FALLBACK_MODEL = 'gemini-2.5-flash-preview-tts'" supabase/functions/dokohilf-tts/index.ts
          grep -q 'Bilder bleiben ausschließlich im Chat' CONFIRMED_WORKFLOWS.md

          node --check assets/update-manager.js
          node --check assets/mobile-audio-fix.js
          node --check assets/voice-diagnostics.js
          node --check assets/routing-fix.js
          node --check assets/conversation-intelligence.js
          node --check assets/clarification-ui.js
          node --check assets/guide-progress.js
          node --check assets/voice-focus-mode.js
          node --check assets/experience-v27.js
          node --check assets/ux-v27.js
          node --check assets/app.js
          node --check assets/editor.js
          node --check service-worker.js
          node --check scripts/generate-guide-audio.mjs
          node --check scripts/mobile-render-v27.mjs
          node --check scripts/live-routing-smoke.mjs
          node --check scripts/live-routing-stable.mjs
          node --check scripts/live-tts-smoke.mjs
          node --check scripts/live-screenshot-smoke.mjs

          grep -q 'localStorage\|indexedDB\|dokohilf-ai-history' assets/app.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' assets/voice-focus-mode.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|caches.open' assets/experience-v27.js && exit 1 || true
          grep -q 'indexedDB\|caches.open' assets/ux-v27.js && exit 1 || true
          grep -q '\.jpe\?g\|\.png\|IMG_' CONFIRMED_WORKFLOWS.md && exit 1 || true

      - name: Run deterministic behavior and audio regressions
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs
          node --test \
            tests/greeting-routing.test.mjs \
            tests/pwa-update.test.mjs \
            tests/pwa-transition.test.mjs \
            tests/guide-progress.test.mjs \
            tests/clarification.test.mjs \
            tests/voice-diagnostics.test.mjs \
            tests/audio-playback-unlock.test.mjs \
            tests/voice-focus-mode.test.mjs \
            tests/behavior-regression.test.mjs \
            tests/mobile-layout-contract.test.mjs \
            tests/privacy-contract.test.mjs \
            tests/editor-security.test.mjs \
            tests/vitalwerte-intent.test.mjs \
            tests/live-build-recovery.test.mjs \
            tests/confirmed-workflows.test.mjs \
            tests/intelligent-router-v26.test.mjs \
            tests/voice-layout-v26.test.mjs \
            tests/dark-premium-v27.test.mjs \
            tests/fast-voice-v27.test.mjs \
            tests/prebuilt-guide-audio.test.mjs

      - name: Render and interact with iPhone layout
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _site >artifacts/mobile-v27-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/mobile-render-v27.mjs

      - name: Check active DokoHilf router
        run: |
          node scripts/live-routing-stable.mjs
          node scripts/live-screenshot-smoke.mjs

      - name: Check active DokoHilf voice service
        run: node scripts/live-tts-smoke.mjs

      - name: Upload behavior, audio and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-build-27-evidence-${{ github.run_number }}
          path: |
            artifacts/
            assets/guide-audio-catalog.json
            assets/guide-audio-manifest.json
            assets/guide-audio-generation-status.json
            assets/audio/guides/*.wav
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

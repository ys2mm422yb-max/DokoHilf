name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and build static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets artifacts
          cp index.html editor.html manifest.webmanifest icon.svg service-worker.js version.json _site/
          cp \
            assets/styles.css \
            assets/update-manager.js \
            assets/mobile-audio-fix.js \
            assets/voice-diagnostics.js \
            assets/routing-fix.js \
            assets/conversation-intelligence.js \
            assets/clarification-ui.js \
            assets/guide-progress.js \
            assets/voice-focus-mode.js \
            assets/task-interface.js \
            assets/app.js \
            assets/editor.css \
            assets/editor.js \
            _site/assets/
          touch _site/.nojekyll

          for file in \
            _site/index.html _site/editor.html _site/version.json _site/service-worker.js _site/icon.svg \
            _site/assets/styles.css _site/assets/update-manager.js _site/assets/mobile-audio-fix.js \
            _site/assets/voice-diagnostics.js _site/assets/routing-fix.js \
            _site/assets/conversation-intelligence.js _site/assets/clarification-ui.js \
            _site/assets/guide-progress.js _site/assets/voice-focus-mode.js \
            _site/assets/task-interface.js _site/assets/app.js _site/assets/editor.css _site/assets/editor.js \
            supabase/functions/dokohilf-guide-state/index.ts \
            supabase/functions/dokohilf-ai-router/index.ts \
            supabase/functions/dokohilf-tts/index.ts \
            supabase/functions/dokohilf-editor/index.ts \
            supabase/migrations/20260806112000_vitalwerte_intent_guides.sql \
            scripts/run-behavior-regressions.mjs scripts/live-routing-smoke.mjs scripts/live-tts-smoke.mjs \
            tests/vitalwerte-intent.test.mjs; do
            test -s "$file"
          done

          grep -q 'dokohilf-build" content="20260806-23' _site/index.html
          grep -q 'task-interface.js?v=20260806-23' _site/index.html
          grep -q 'app.js?v=20260806-23' _site/index.html
          grep -q '"buildId": "20260806-23"' _site/version.json
          grep -q "BUILD_ID = '20260806-23'" _site/service-worker.js
          grep -q 'task-interface.js?v=20260806-23' _site/service-worker.js

          grep -q 'conversational-guide-router-v5' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'wantsVitalEntry' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'currentGuideStep' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'guidePayload' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'vitalwerte-einzelwert-fortsetzen' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'vitalwerte-sammelerfassung-fortsetzen' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'Bewahre das bereits genannte Ziel' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'containsSensitiveData' supabase/functions/dokohilf-ai-router/index.ts

          grep -q 'grüne Plus' supabase/migrations/20260806112000_vitalwerte_intent_guides.sql
          grep -q 'Sammelerfassung' supabase/migrations/20260806112000_vitalwerte_intent_guides.sql
          grep -q 'Pop-up-Fenster' supabase/migrations/20260806112000_vitalwerte_intent_guides.sql

          grep -q '__DOKOHILF_TASK_INTERFACE_V1__' _site/assets/task-interface.js
          grep -q 'Erledigt – weiter' _site/assets/task-interface.js
          grep -q 'guideStep' _site/assets/task-interface.js
          grep -q 'choiceTitle' _site/assets/clarification-ui.js
          grep -q 'clarification-option-description' _site/assets/clarification-ui.js
          grep -q 'guideStepCount' _site/assets/guide-progress.js
          grep -q "VOICE_NAME = 'Vindemiatrix'" supabase/functions/dokohilf-tts/index.ts
          grep -q 'Schutzfilter prüft jede Eingabe' _site/index.html
          grep -q 'Redaktion anmelden' _site/editor.html

          grep -q 'localStorage\|indexedDB\|sessionStorage' _site/assets/task-interface.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' _site/assets/voice-focus-mode.js && exit 1 || true
          grep -q 'localStorage\|indexedDB' _site/assets/app.js && exit 1 || true
          grep -q 'SUPABASE_SERVICE_ROLE_KEY\|service_role' _site/assets/editor.js && exit 1 || true
          grep -q 'auth/v1/signup\|signUp(' _site/assets/editor.js && exit 1 || true

          node --check _site/assets/update-manager.js
          node --check _site/assets/mobile-audio-fix.js
          node --check _site/assets/voice-diagnostics.js
          node --check _site/assets/routing-fix.js
          node --check _site/assets/conversation-intelligence.js
          node --check _site/assets/clarification-ui.js
          node --check _site/assets/guide-progress.js
          node --check _site/assets/voice-focus-mode.js
          node --check _site/assets/task-interface.js
          node --check _site/assets/app.js
          node --check _site/assets/editor.js
          node --check _site/service-worker.js
          node --check scripts/live-routing-smoke.mjs
          node --check scripts/live-tts-smoke.mjs

      - name: Run deterministic behavior regressions
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs
          node --test \
            tests/greeting-routing.test.mjs \
            tests/pwa-update.test.mjs \
            tests/pwa-transition.test.mjs \
            tests/guide-progress.test.mjs \
            tests/clarification.test.mjs \
            tests/voice-diagnostics.test.mjs \
            tests/audio-playback-unlock.test.mjs \
            tests/voice-focus-mode.test.mjs \
            tests/task-interface.test.mjs \
            tests/behavior-regression.test.mjs \
            tests/mobile-layout-contract.test.mjs \
            tests/privacy-contract.test.mjs \
            tests/editor-security.test.mjs \
            tests/vitalwerte-intent.test.mjs

      - name: Check active DokoHilf router
        run: node scripts/live-routing-smoke.mjs

      - name: Check active DokoHilf voice service
        run: node scripts/live-tts-smoke.mjs

      - name: Upload behavior report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-behavior-report-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and build static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html manifest.webmanifest icon.svg service-worker.js _site/
          cp assets/styles.css assets/mobile-audio-fix.js assets/routing-fix.js assets/app.js _site/assets/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/assets/styles.css
          test -s _site/assets/mobile-audio-fix.js
          test -s _site/assets/routing-fix.js
          test -s _site/assets/app.js
          test -s _site/service-worker.js
          test -s _site/icon.svg
          grep -q "Sprachgespräch" _site/index.html
          grep -q "data-select-mode=\"chat\"" _site/index.html
          grep -q "Hauptmenü" _site/index.html
          grep -q "mobile-audio-fix.js?v=20260805-12" _site/index.html
          grep -q "routing-fix.js?v=20260805-block1" _site/index.html
          grep -q "app.js?v=20260805-12" _site/index.html
          grep -q "serviceWorker.register" _site/assets/app.js
          grep -q "TTS_ENDPOINT" _site/assets/app.js
          grep -q "TTS_TIMEOUT_MS = 20000" _site/assets/mobile-audio-fix.js
          grep -q "__DOKOHILF_NATURAL_VOICE__" _site/assets/mobile-audio-fix.js
          grep -q "__DOKOHILF_MOBILE_VOICE_V2__" _site/assets/mobile-audio-fix.js
          grep -q "persistentVoiceControlStyles" _site/assets/mobile-audio-fix.js
          grep -q "position:fixed!important" _site/assets/mobile-audio-fix.js
          grep -q "MutationObserver" _site/assets/mobile-audio-fix.js
          grep -q "notfallblattButton" _site/assets/mobile-audio-fix.js
          grep -q "Wie öffne ich das Notfallblatt" _site/assets/mobile-audio-fix.js
          grep -q "__DOKOHILF_GREETING_ROUTING_PATCH__" _site/assets/routing-fix.js
          grep -q "stripLeadingGreeting" _site/assets/routing-fix.js
          grep -q "dokohilf-shell-v20260805-13" _site/service-worker.js
          grep -q "routing-fix.js?v=20260805-block1" _site/service-worker.js
          grep -q "SKIP_WAITING" _site/service-worker.js
          grep -q "Schutzfilter prüft jede Eingabe" _site/index.html
          grep -q "AI_ENDPOINT" _site/assets/app.js

          # Das Gespräch darf sich nur innerhalb der laufenden Sitzung erinnern.
          grep -q "const MAX_HISTORY = 12" _site/assets/app.js
          grep -q "function resetConversation" _site/assets/app.js
          grep -q "window.addEventListener('pagehide'" _site/assets/app.js
          test "$(grep -c "state.history = \[\]" _site/assets/app.js)" -ge 2
          grep -q "state.activeGuide = null" _site/assets/app.js

          # Keine dauerhafte Speicherung von Gesprächsverläufen.
          grep -q "sessionStorage\|localStorage\|indexedDB\|dokohilf-ai-history" _site/assets/app.js && exit 1 || true
          grep -q "PLACEHOLDER" _site/index.html && exit 1 || true
          node --check _site/assets/mobile-audio-fix.js
          node --check _site/assets/routing-fix.js
          node --check _site/assets/app.js
          node --check _site/service-worker.js
          node --test tests/greeting-routing.test.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@v4

      - name: Validate source contracts and syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for file in \
            README.md PROJECT_RULES.md PROJECT_HANDOFF.md CONFIRMED_WORKFLOWS.md PREBUILT_AUDIO.md AUDIO_PROVIDER_BLOCKER.md \
            FINAL_SCOPE_V27.md ACTIVE_WORK_STATIC_AUDIO.md ACTIVE_WORK_MOBILE_CROSS_PLATFORM.md ACTIVE_WORK_DIRECT_GUIDES_CHAT.md \
            ACTIVE_WORK_ACCOUNT_FREE_V28.md \
            assets/guide-audio-catalog.json assets/voice-extra-catalog-v28.json assets/direct-guides-v27.js assets/direct-guides-chat-v27.css \
            scripts/mobile-render-v27.mjs scripts/build-static-site-v27.sh scripts/build-supertonic-guide-audio-v28.py \
            scripts/run-behavior-regressions.mjs scripts/live-routing-smoke.mjs \
            scripts/live-routing-stable.mjs scripts/live-vitalwerte-routing-smoke.mjs \
            tests/prebuilt-guide-audio.test.mjs tests/dark-premium-v27.test.mjs tests/fast-voice-v27.test.mjs tests/direct-guides-v27.test.mjs \
            tests/public-documentation-boundary.test.mjs tests/account-free-product.test.mjs \
            supabase/functions/dokohilf-ai-router/index.ts \
            supabase/functions/dokohilf-editor/index.ts \
            supabase/functions/dokohilf-tts/index.ts \
            supabase/functions/dokohilf-guide-audio/index.ts \
            supabase/functions/dokohilf-guide-audio-build/index.ts \
            supabase/config.toml \
            supabase/migrations/20260806194500_create_static_guide_audio_registry.sql \
            supabase/migrations/20260806200500_secure_static_guide_audio_builder.sql \
            supabase/migrations/20260807214545_retire_legacy_cloud_voice.sql \
            supabase/migrations/20260807230003_remove_app_account_infrastructure.sql; do
            test -s "$file"
          done

          grep -q '__DOKOHILF_DARK_PREMIUM_V27__' assets/experience-v27.js
          grep -q '__DOKOHILF_PREBUILT_GUIDE_AUDIO_V1__' assets/experience-v27.js
          grep -q 'guide-progress-menu' assets/ux-v27.js
          grep -q '__DOKOHILF_PRIVACY_ACK_V27__' assets/ux-v27.js
          grep -q '__DOKOHILF_IDEMPOTENT_SYNC_V27__' assets/ux-v27.js
          grep -q "PRIVACY_ACK_KEY = 'dokohilf-privacy-ack-v1'" assets/ux-v27.js
          test "$(grep -o 'localStorage\.[a-zA-Z]*' assets/ux-v27.js | sort -u | tr '\n' ' ')" = "localStorage.getItem localStorage.setItem "
          grep -q '__DOKOHILF_DIRECT_GUIDES_V27__' assets/direct-guides-v27.js
          grep -q "dataset.mode = 'direct-guide'" assets/direct-guides-v27.js
          grep -q 'direct-guides-cross-platform' assets/direct-guides-v27.js
          grep -q 'command-message-hidden' assets/ux-v27.css
          grep -q 'data-voice-state="listening"' assets/ux-v27.css
          grep -q -- '--v27-bg:#020c12' assets/premium-ui-v27.css
          grep -q 'color-scheme:dark' assets/premium-ui-v27.css
          grep -q "DOKOHILF_MOBILE_PROFILE || 'ios'" scripts/mobile-render-v27.mjs
          grep -q "PROFILE === 'android'" scripts/mobile-render-v27.mjs
          grep -q '412 × 915' ACTIVE_WORK_MOBILE_CROSS_PLATFORM.md
          grep -q 'conversational-guide-router-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'medication-view-only-safety-v9' supabase/functions/dokohilf-ai-router/index.ts
          grep -q 'cloud_tts_retired_v28' supabase/functions/dokohilf-tts/index.ts
          grep -q 'legacy_cloud_audio_builder_retired_v28' supabase/functions/dokohilf-guide-audio-build/index.ts
          grep -q 'legacy_gacrux_audio_delivery_retired_v28' supabase/functions/dokohilf-guide-audio/index.ts
          grep -q '\[functions.dokohilf-guide-audio\]' supabase/config.toml
          grep -q 'verify_jwt = true' supabase/config.toml
          grep -q "cron.unschedule(jobid)" supabase/migrations/20260807214545_retire_legacy_cloud_voice.sql
          grep -q 'Dauerhaftes absolutes Echtdatenverbot' PROJECT_RULES.md
          grep -q 'Eine spätere Freigabe darf dieses Verbot' PROJECT_RULES.md
          grep -q 'Öffentliche Dokumentation enthält keine Angaben zu Herkunft' CONFIRMED_WORKFLOWS.md
          grep -q "STATIC_VOICE = 'Supertonic-F1'" assets/local-voice-gate-v28.js
          grep -q '__DOKOHILF_STATIC_SUPERTONIC_V28__' assets/local-voice-gate-v28.js
          grep -q 'TTS(auto_download=True)' scripts/build-supertonic-guide-audio-v28.py
          grep -q "lang='de'" scripts/build-supertonic-guide-audio-v28.py
          grep -q 'STATIC_SPEECH_COUNT = BASE_GUIDE_COUNT + EXTRA_SPEECH_COUNT' scripts/build-supertonic-guide-audio-v28.py
          grep -q 'Okay. Schau oben in die grüne Reiterleiste' assets/voice-extra-catalog-v28.json
          grep -q 'git push --force origin HEAD:gh-pages' .github/workflows/pages.yml
          if grep -q '[a]ctions/deploy-pages' .github/workflows/pages.yml; then
            echo "Pages wird über den geschützten gh-pages-Branch veröffentlicht; ein zusätzlicher API-Deployjob ist unzulässig." >&2
            exit 1
          fi
          test ! -e editor.html
          test ! -e assets/editor.js
          test ! -e assets/editor.css
          test ! -e docs/EDITOR_ROLLOUT.md
          grep -q 'app_accounts_retired_v28' supabase/functions/dokohilf-editor/index.ts
          grep -q 'drop table if exists public.dokohilf_user_roles' supabase/migrations/20260807230003_remove_app_account_infrastructure.sql
          grep -q 'dokohilf_block_all_user_creation' supabase/migrations/20260807230003_remove_app_account_infrastructure.sql
          grep -q 'before insert on auth.users' supabase/migrations/20260807230003_remove_app_account_infrastructure.sql
          grep -q '\[functions.dokohilf-editor\]' supabase/config.toml

          node --check assets/update-manager.js
          node --check assets/mobile-audio-fix.js
          node --check assets/routing-fix.js
          node --check assets/conversation-intelligence.js
          node --check assets/clarification-ui.js
          node --check assets/guide-progress.js
          node --check assets/voice-focus-mode.js
          node --check assets/experience-v27.js
          node --check assets/ux-v27.js
          node --check assets/direct-guides-v27.js
          node --check assets/app.js
          node --check service-worker.js
          node --check scripts/mobile-render-v27.mjs
          node --check scripts/live-routing-smoke.mjs
          node --check scripts/live-routing-stable.mjs
          node --check scripts/live-vitalwerte-routing-smoke.mjs
          python3 -m py_compile scripts/build-supertonic-guide-audio-v28.py
          python3 scripts/build-supertonic-guide-audio-v28.py --validate-only

          grep -q 'localStorage\|indexedDB\|dokohilf-ai-history' assets/app.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' assets/voice-focus-mode.js && exit 1 || true
          grep -q 'localStorage\|indexedDB' assets/experience-v27.js && exit 1 || true
          grep -q 'localStorage\|indexedDB' assets/direct-guides-v27.js && exit 1 || true
          grep -q 'indexedDB' assets/ux-v27.js && exit 1 || true
          grep -q '\.jpe\?g\|\.png\|IMG_' CONFIRMED_WORKFLOWS.md && exit 1 || true

      - name: Run deterministic fachliche, privacy and UI contracts
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs
          node --test \
            tests/greeting-routing.test.mjs \
            tests/pwa-update.test.mjs \
            tests/pwa-transition.test.mjs \
            tests/guide-progress.test.mjs \
            tests/clarification.test.mjs \
            tests/voice-diagnostics.test.mjs \
            tests/audio-playback-unlock.test.mjs \
            tests/voice-focus-mode.test.mjs \
            tests/behavior-regression.test.mjs \
            tests/mobile-layout-contract.test.mjs \
            tests/privacy-contract.test.mjs \
            tests/public-documentation-boundary.test.mjs \
            tests/account-free-product.test.mjs \
            tests/vitalwerte-intent.test.mjs \
            tests/live-build-recovery.test.mjs \
            tests/confirmed-workflows.test.mjs \
            tests/intelligent-router-v26.test.mjs \
            tests/voice-layout-v26.test.mjs \
            tests/dark-premium-v27.test.mjs \
            tests/fast-voice-v27.test.mjs \
            tests/prebuilt-guide-audio.test.mjs \
            tests/direct-guides-v27.test.mjs \
            tests/local-voice-v28.test.mjs \
            tests/voice-spoken-report-conditional-v28.test.mjs

      - name: Build isolated UI test surface
        run: |
          set -euo pipefail
          mkdir -p _ui_site/assets artifacts/mobile-v27/ios artifacts/mobile-v27/android
          cp index.html manifest.webmanifest icon.svg service-worker.js version.json _ui_site/
          cp -R assets/. _ui_site/assets/
          rm -rf _ui_site/assets/audio
          rm -f _ui_site/assets/guide-audio-manifest.json
          touch _ui_site/.nojekyll

      - name: Render and interact with iOS and Android layouts
        env:
          DOKOHILF_UI_MOCK: '1'
          DOKOHILF_RENDER_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _ui_site >artifacts/mobile-v27-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          DOKOHILF_MOBILE_PROFILE=ios DOKOHILF_VIEWPORT_WIDTH=393 DOKOHILF_VIEWPORT_HEIGHT=852 DOKOHILF_DEVICE_SCALE_FACTOR=2 DOKOHILF_RENDER_OUTPUT=artifacts/mobile-v27/ios node scripts/mobile-render-v27.mjs
          DOKOHILF_MOBILE_PROFILE=android DOKOHILF_VIEWPORT_WIDTH=412 DOKOHILF_VIEWPORT_HEIGHT=915 DOKOHILF_DEVICE_SCALE_FACTOR=2 DOKOHILF_RENDER_OUTPUT=artifacts/mobile-v27/android node scripts/mobile-render-v27.mjs

      - name: Check active DokoHilf router
        run: |
          node scripts/live-routing-stable.mjs
          node scripts/live-vitalwerte-routing-smoke.mjs

      - name: Set up Python for free static voice build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Supertonic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: dokohilf-supertonic3-model-v1

      - name: Generate all confirmed static speech with Supertonic
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'supertonic==1.3.1'
          rm -rf assets/audio/guides
          python scripts/build-supertonic-guide-audio-v28.py \
            --catalog assets/guide-audio-catalog.json \
            --extra-catalog assets/voice-extra-catalog-v28.json \
            --output-root assets/audio/guides \
            --voice F1 \
            --steps 8 \
            --speed 1.05
          expected="$(python -c "import json; print(len(json.load(open('assets/guide-audio-catalog.json', encoding='utf-8'))['entries']))")"
          actual="$(find assets/audio/guides -maxdepth 1 -type f -name '*.wav' | wc -l | tr -d ' ')"
          test "$expected" = 111
          test "$actual" = 111
          grep -q '"voice": "Supertonic-F1"' assets/guide-audio-catalog.json
          grep -q '"baseGuideCount": 93' assets/guide-audio-catalog.json
          grep -q '"extraSpeechCount": 18' assets/guide-audio-catalog.json
          grep -q '"staticSpeechCount": 111' assets/guide-audio-catalog.json

      - name: Build exact releasable static site
        env:
          DOKOHILF_REQUIRE_STATIC_SUPERTONIC: '1'
        run: |
          set -euo pipefail
          bash -n scripts/build-static-site-v27.sh
          bash scripts/build-static-site-v27.sh _site

      - name: Upload behavior and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-build-28-evidence-${{ github.run_number }}
          path: |
            artifacts/
            assets/audio/guides/build-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the same exact site to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish DokoHilf ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages

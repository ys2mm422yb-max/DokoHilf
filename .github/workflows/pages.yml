name: Deploy DokoHilf

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository head
        uses: actions/checkout@v4

      - name: Validate source contracts and syntax
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUILD_ID="$(node -p "require('./version.json').buildId")"
          test -n "$BUILD_ID"

          for file in \
            README.md PROJECT_RULES.md PROJECT_HANDOFF.md CONFIRMED_WORKFLOWS.md STATIC_VOICE_POLICY.md \
            PREBUILT_AUDIO.md AUDIO_PROVIDER_BLOCKER.md FINAL_SCOPE_V27.md ACTIVE_WORK_STATIC_AUDIO.md \
            ACTIVE_WORK_MOBILE_CROSS_PLATFORM.md ACTIVE_WORK_DIRECT_GUIDES_CHAT.md ACTIVE_WORK_ACCOUNT_FREE_V28.md \
            assets/guide-audio-catalog.json assets/voice-extra-catalog-v28.json assets/voice-release-catalog-v29.json \
            assets/voice-durchfuehrung-catalog-v29.json assets/voice-ui-catalog-v29.json \
            assets/voice-navigation-catalog-v29.json assets/voice-context-help-catalog-v29.json \
            assets/direct-guides-v27.js assets/direct-guide-copy-v29.js assets/direct-guides-chat-v27.css \
            assets/durchfuehrungs-workflows-v29.js assets/orientation-help-v29.js assets/release-polish-v29.js \
            assets/local-voice-v28.js assets/local-voice-gate-v28.js assets/smart-help-v29.js assets/v29-ui.js assets/v29-ui.css \
            scripts/mobile-render-v27.mjs scripts/build-static-site-v27.sh scripts/build-supertonic-guide-audio-v28.py \
            scripts/run-behavior-regressions.mjs scripts/live-routing-smoke.mjs scripts/live-routing-stable.mjs \
            scripts/live-vitalwerte-routing-smoke.mjs tests/local-voice-v28.test.mjs tests/v29-smart-help-ui.test.mjs \
            tests/public-documentation-boundary.test.mjs tests/account-free-product.test.mjs \
            supabase/functions/dokohilf-ai-router/index.ts supabase/functions/dokohilf-chat-router/index.ts \
            supabase/functions/dokohilf-editor/index.ts supabase/functions/dokohilf-tts/index.ts \
            supabase/functions/dokohilf-guide-audio/index.ts supabase/functions/dokohilf-guide-audio-build/index.ts \
            supabase/config.toml \
            supabase/migrations/20260807214545_retire_legacy_cloud_voice.sql \
            supabase/migrations/20260807230003_remove_app_account_infrastructure.sql \
            supabase/migrations/20260807232000_deny_all_app_guide_access.sql \
            supabase/migrations/20260807232412_relocate_accountless_trigger_functions.sql \
            supabase/migrations/20260809124000_bedarfsmedikation_massnahmen_v29.sql \
            supabase/migrations/20260809125500_green_navigation_hierarchy_v29.sql; do
            test -s "$file"
          done

          grep -q 'Dauerhaftes absolutes Echtdatenverbot' PROJECT_RULES.md
          grep -q 'Eine spätere Freigabe darf dieses Verbot' PROJECT_RULES.md
          grep -q 'Öffentliche Dokumentation enthält keine Angaben zu Herkunft' CONFIRMED_WORKFLOWS.md
          grep -q '__DOKOHILF_LOCAL_VOICE_RETIRED_V29__' assets/local-voice-v28.js
          grep -q '__DOKOHILF_STATIC_SUPERTONIC_ONLY_V29__' assets/local-voice-v28.js
          grep -q "STATIC_VOICE = 'Supertonic-F1'" assets/local-voice-gate-v28.js
          grep -q '__DOKOHILF_STATIC_SUPERTONIC_V28__' assets/local-voice-gate-v28.js
          grep -q '__DOKOHILF_STATIC_SUPERTONIC_ONLY_V29__' assets/local-voice-gate-v28.js
          grep -q "STATIC_AUDIO_CACHE = 'dokohilf-static-supertonic-audio-v29-2'" assets/local-voice-gate-v28.js
          grep -q 'AUDIO_TIMEOUT_MS = 8000' assets/local-voice-gate-v28.js
          ! grep -q 'IOS_LOCAL_TIMEOUT_MS\|OTHER_LOCAL_TIMEOUT_MS\|localFallback\|DokoHilfLocalVoiceV28.synthesize' assets/local-voice-gate-v28.js
          ! grep -q 'Supertone/supertonic-3/resolve/main\|loadTextToSpeech\|loadVoiceStyle\|navigator.gpu\|onnxruntime' assets/local-voice-v28.js
          grep -Fq 'meta[name="dokohilf-build"]' assets/local-voice-gate-v28.js
          grep -Fq 'encodeURIComponent(BUILD_ID)' assets/local-voice-gate-v28.js
          grep -q '__DOKOHILF_SMART_HELP_V29__' assets/smart-help-v29.js
          grep -q '__DOKOHILF_UI_V29__' assets/v29-ui.js
          grep -q '__DOKOHILF_ORIENTATION_HELP_V29__' assets/orientation-help-v29.js
          grep -q 'feste grüne Leiste' assets/orientation-help-v29.js
          grep -q '__DOKOHILF_DURCHFUEHRUNGS_WORKFLOWS_V29__' assets/durchfuehrungs-workflows-v29.js
          grep -q 'Bedarfsmedikation' assets/durchfuehrungs-workflows-v29.js
          grep -q 'Wirksamkeitskontrolle' assets/durchfuehrungs-workflows-v29.js
          grep -q 'Maßnahmen ohne Zeitangabe' assets/durchfuehrungs-workflows-v29.js
          grep -q 'data-voice-state="thinking"' assets/v29-ui.css
          grep -q 'data-voice-state="speaking"' assets/v29-ui.css
          grep -q 'TTS(auto_download=True)' scripts/build-supertonic-guide-audio-v28.py
          grep -q "lang='de'" scripts/build-supertonic-guide-audio-v28.py
          grep -q 'EXPECTED_SOURCE_COUNTS' scripts/build-supertonic-guide-audio-v28.py
          grep -q "'base': 93" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'extra': 33" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'release': 49" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'workflow': 39" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'ui': 1" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'navigation': 17" scripts/build-supertonic-guide-audio-v28.py
          grep -q "'context': 10" scripts/build-supertonic-guide-audio-v28.py
          grep -q 'static_speech_count = len(entries)' scripts/build-supertonic-guide-audio-v28.py
          ! grep -q 'STATIC_SPEECH_COUNT[[:space:]]*=' scripts/build-supertonic-guide-audio-v28.py
          grep -q 'Hey! Wobei brauchst du Hilfe?' assets/voice-ui-catalog-v29.json
          grep -q 'KI · v29' index.html
          grep -q 'id="buildPill" type="button" hidden' index.html
          grep -Fq "\"buildId\": \"$BUILD_ID\"" version.json
          grep -Fq "dokohilf-build\" content=\"$BUILD_ID" index.html
          grep -Fq "const BUILD_ID = '$BUILD_ID';" service-worker.js
          grep -q 'git push --force origin HEAD:gh-pages' .github/workflows/pages.yml
          if grep -q '[a]ctions/deploy-pages' .github/workflows/pages.yml; then
            echo "Pages wird über den geschützten gh-pages-Branch veröffentlicht; ein zusätzlicher API-Deployjob ist unzulässig." >&2
            exit 1
          fi

          test ! -e editor.html
          test ! -e assets/editor.js
          test ! -e assets/editor.css
          test ! -e docs/EDITOR_ROLLOUT.md
          grep -q 'app_accounts_retired_v28' supabase/functions/dokohilf-editor/index.ts
          grep -q 'enable_signup = false' supabase/config.toml

          node --check assets/update-manager.js
          node --check assets/mobile-audio-fix.js
          node --check assets/routing-fix.js
          node --check assets/conversation-intelligence.js
          node --check assets/clarification-ui.js
          node --check assets/smart-help-v29.js
          node --check assets/guide-progress.js
          node --check assets/voice-focus-mode.js
          node --check assets/experience-v27.js
          node --check assets/ux-v27.js
          node --check assets/v29-ui.js
          node --check assets/direct-guides-v27.js
          node --check assets/direct-guide-copy-v29.js
          node --check assets/durchfuehrungs-workflows-v29.js
          node --check assets/orientation-help-v29.js
          node --check assets/local-voice-v28.js
          node --check assets/local-voice-gate-v28.js
          node --check assets/app.js
          node --check service-worker.js
          node --check scripts/mobile-render-v27.mjs
          node --check scripts/live-routing-smoke.mjs
          node --check scripts/live-routing-stable.mjs
          node --check scripts/live-vitalwerte-routing-smoke.mjs
          python3 -m py_compile scripts/build-supertonic-guide-audio-v28.py
          python3 scripts/build-supertonic-guide-audio-v28.py --validate-only

          grep -q 'localStorage\|indexedDB\|dokohilf-ai-history' assets/app.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' assets/voice-focus-mode.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' assets/smart-help-v29.js && exit 1 || true
          grep -q 'localStorage\|indexedDB\|sessionStorage' assets/v29-ui.js && exit 1 || true
          grep -q 'localStorage\|indexedDB' assets/experience-v27.js && exit 1 || true
          grep -q 'localStorage\|indexedDB' assets/direct-guides-v27.js && exit 1 || true
          grep -q 'indexedDB' assets/ux-v27.js && exit 1 || true
          grep -q '\.jpe\?g\|\.png\|IMG_' CONFIRMED_WORKFLOWS.md && exit 1 || true

      - name: Run deterministic fachliche, privacy and UI contracts
        run: |
          set -euo pipefail
          node scripts/run-behavior-regressions.mjs
          node --test \
            tests/greeting-routing.test.mjs \
            tests/pwa-update.test.mjs \
            tests/pwa-transition.test.mjs \
            tests/guide-progress.test.mjs \
            tests/clarification.test.mjs \
            tests/voice-diagnostics.test.mjs \
            tests/audio-playback-unlock.test.mjs \
            tests/voice-focus-mode.test.mjs \
            tests/behavior-regression.test.mjs \
            tests/mobile-layout-contract.test.mjs \
            tests/privacy-contract.test.mjs \
            tests/public-documentation-boundary.test.mjs \
            tests/account-free-product.test.mjs \
            tests/vitalwerte-intent.test.mjs \
            tests/live-build-recovery.test.mjs \
            tests/confirmed-workflows.test.mjs \
            tests/intelligent-router-v26.test.mjs \
            tests/voice-layout-v26.test.mjs \
            tests/dark-premium-v27.test.mjs \
            tests/fast-voice-v27.test.mjs \
            tests/prebuilt-guide-audio.test.mjs \
            tests/direct-guides-v27.test.mjs \
            tests/local-voice-v28.test.mjs \
            tests/voice-spoken-report-conditional-v28.test.mjs \
            tests/v29-smart-help-ui.test.mjs

      - name: Build isolated UI test surface
        run: |
          set -euo pipefail
          mkdir -p _ui_site/assets artifacts/mobile-v29/ios artifacts/mobile-v29/android
          cp index.html manifest.webmanifest icon.svg service-worker.js version.json _ui_site/
          cp -R assets/. _ui_site/assets/
          rm -rf _ui_site/assets/audio
          rm -f _ui_site/assets/guide-audio-manifest.json
          touch _ui_site/.nojekyll

      - name: Render and interact with iOS and Android layouts
        env:
          DOKOHILF_UI_MOCK: '1'
          DOKOHILF_RENDER_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _ui_site >artifacts/mobile-v29-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          DOKOHILF_MOBILE_PROFILE=ios DOKOHILF_VIEWPORT_WIDTH=393 DOKOHILF_VIEWPORT_HEIGHT=852 DOKOHILF_DEVICE_SCALE_FACTOR=2 DOKOHILF_RENDER_OUTPUT=artifacts/mobile-v29/ios node scripts/mobile-render-v27.mjs
          DOKOHILF_MOBILE_PROFILE=android DOKOHILF_VIEWPORT_WIDTH=412 DOKOHILF_VIEWPORT_HEIGHT=915 DOKOHILF_DEVICE_SCALE_FACTOR=2 DOKOHILF_RENDER_OUTPUT=artifacts/mobile-v29/android node scripts/mobile-render-v27.mjs

      - name: Check active DokoHilf router
        run: |
          set -euo pipefail
          node scripts/live-routing-stable.mjs
          node scripts/live-vitalwerte-routing-smoke.mjs

      - name: Set up Python for free static voice build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Supertonic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: dokohilf-supertonic3-model-v1

      - name: Generate all confirmed static speech with Supertonic
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'supertonic==1.3.1'
          rm -rf assets/audio/guides
          python scripts/build-supertonic-guide-audio-v28.py \
            --output-root assets/audio/guides \
            --voice F1 \
            --steps 8 \
            --speed 1.05
          expected="$(python -c "import json; print(len(json.load(open('assets/guide-audio-catalog.json', encoding='utf-8'))['entries']))")"
          actual="$(find assets/audio/guides -maxdepth 1 -type f -name '*.wav' | wc -l | tr -d ' ')"
          summary="$(python -c "import json; print(json.load(open('assets/audio/guides/build-summary.json', encoding='utf-8'))['staticSpeechCount'])")"
          test "$expected" = "$actual"
          test "$expected" = "$summary"
          grep -q '"voice": "Supertonic-F1"' assets/guide-audio-catalog.json
          grep -q '"engine": "Supertonic 3"' assets/audio/guides/build-summary.json
          grep -q '"base": 93' assets/guide-audio-catalog.json
          grep -q '"extra": 33' assets/guide-audio-catalog.json
          grep -q '"release": 49' assets/guide-audio-catalog.json
          grep -q '"workflow": 39' assets/guide-audio-catalog.json
          grep -q '"ui": 1' assets/guide-audio-catalog.json
          grep -q '"navigation": 17' assets/guide-audio-catalog.json
          grep -q '"context": 10' assets/guide-audio-catalog.json

      - name: Build exact releasable static site
        env:
          DOKOHILF_REQUIRE_STATIC_SUPERTONIC: '1'
        run: |
          set -euo pipefail
          bash -n scripts/build-static-site-v27.sh
          bash scripts/build-static-site-v27.sh _site

      - name: Upload behavior and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokohilf-build-29-evidence-${{ github.run_number }}
          path: |
            artifacts/
            assets/audio/guides/build-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the same exact site to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish DokoHilf ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages

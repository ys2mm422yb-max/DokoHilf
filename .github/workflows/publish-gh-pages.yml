name: Publish DokoHilf to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build static Pages directory
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html editor.html manifest.webmanifest icon.svg service-worker.js version.json _site/
          cp \
            assets/styles.css \
            assets/update-manager.js \
            assets/mobile-audio-fix.js \
            assets/voice-diagnostics.js \
            assets/routing-fix.js \
            assets/conversation-intelligence.js \
            assets/clarification-ui.js \
            assets/guide-progress.js \
            assets/voice-focus-mode.js \
            assets/app.js \
            assets/editor.css \
            assets/editor.js \
            _site/assets/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/version.json
          grep -q 'dokohilf-build" content="20260806-24' _site/index.html
          grep -q 'KI · v24' _site/index.html
          grep -q '"buildId": "20260806-24"' _site/version.json

      - name: Publish exact site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish DokoHilf ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages

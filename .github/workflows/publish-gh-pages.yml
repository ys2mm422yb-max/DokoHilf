name: Publish DokoHilf to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate available private Gacrux guide audio
        run: |
          set -euo pipefail
          node --check scripts/live-static-guide-audio-smoke.mjs
          node scripts/live-static-guide-audio-smoke.mjs

      - name: Build exact static Pages directory
        run: |
          set -euo pipefail
          bash -n scripts/build-static-site-v27.sh
          bash scripts/build-static-site-v27.sh _site

      - name: Publish exact site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish DokoHilf ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages

name: Publish DokoHilf to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dokohilf-gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python for free static voice build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Supertonic model
        uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: dokohilf-supertonic3-model-v1

      - name: Generate all 111 confirmed static speech sentences
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'supertonic==1.3.1'
          rm -rf assets/audio/guides
          python scripts/build-supertonic-guide-audio-v28.py \
            --catalog assets/guide-audio-catalog.json \
            --extra-catalog assets/voice-extra-catalog-v28.json \
            --output-root assets/audio/guides \
            --voice F1 \
            --steps 8 \
            --speed 1.05
          test "$(find assets/audio/guides -maxdepth 1 -type f -name '*.wav' | wc -l | tr -d ' ')" = 111

      - name: Build exact static Pages directory
        env:
          DOKOHILF_REQUIRE_STATIC_SUPERTONIC: '1'
        run: |
          set -euo pipefail
          bash -n scripts/build-static-site-v27.sh
          bash scripts/build-static-site-v27.sh _site

      - name: Publish exact site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish DokoHilf ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
